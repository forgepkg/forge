[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "forge-server"
path = "src/main.rs"

[lib]
name = "forge_server"
path = "src/lib.rs"

[dependencies]
forge-db = { path = "../db" }
forge-storage = { path = "../storage" }
forge-cache = { path = "../cache" }
forge-core = { path = "../core" }
forge-crypto = { path = "../crypto" }
forge-nuget = { path = "../format-nuget" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal"] }
axum = { workspace = true, features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
# WIF (slice 12.8): decode the unverified JWT header/payload for issuer routing
# (cryptographic verification stays in forge-core's JWKS verifier) and the HTTP
# Basic credential when a workload presents its id_token as the password.
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ipnet = { workspace = true }
url = { workspace = true }
argon2 = { workspace = true, features = ["password-hash"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

# Config: TOML + FORGE_* env overrides.
figment = { version = "0.10", features = ["toml", "env"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "test-util"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
reqwest = { workspace = true, features = ["multipart"] }
forge-nuget = { path = "../format-nuget" }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
figment = { version = "0.10", features = ["toml", "env", "test"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# Mock OIDC IdP for the /auth route integration tests (slice 12.2 Phase 5):
# serve discovery/JWKS/token, sign a self-issued ID token with a throwaway RSA
# key. Mirrors the forge-core OIDC test harness.
wiremock = "0.6"
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sqlx = { workspace = true }
