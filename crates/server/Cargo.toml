[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "forge-server"
path = "src/main.rs"

[lib]
name = "forge_server"
path = "src/lib.rs"

[dependencies]
forge-db = { path = "../db" }
forge-storage = { path = "../storage" }
forge-cache = { path = "../cache" }
forge-core = { path = "../core" }
forge-crypto = { path = "../crypto" }
forge-plugin = { path = "../plugin" }
forge-telemetry = { path = "../telemetry" }
forge-traffic = { path = "../traffic" }
# The built-in format plugins (crates/formats/docker, crates/formats/nuget,
# crates/formats/npm, crates/formats/raw), linked in.
forge-format-docker = { path = "../formats/docker" }
forge-format-nuget = { path = "../formats/nuget" }
forge-format-npm = { path = "../formats/npm" }
forge-format-raw = { path = "../formats/raw" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal"] }
axum = { workspace = true, features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true }
# The HTTP server loop (`serve`): hyper's header-read timeout needs a timer,
# which `axum::serve` does not configure.
hyper = { version = "1", features = ["server", "http1", "http2"] }
# The metrics middleware counts the bytes of response bodies.
http-body = "1"
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
sqlx = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The `log` bridge's level (main.rs), which the pool's TRACE events raise.
log = "0.4"
# OpenTelemetry export (crate::telemetry): the SDK, OTLP over HTTP, and the
# bridges of `tracing` spans and events to traces and logs.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
# WIF: decode the unverified JWT header/payload for issuer routing
# (cryptographic verification stays in forge-core's JWKS verifier) and the HTTP
# Basic credential when a workload presents its id_token as the password.
base64 = { workspace = true }
sha2 = { workspace = true }
# Nexus imports: an asset whose listing carries no SHA-256 or SHA-512 (older
# Nexus 3 versions) is verified against its SHA-1.
sha1 = "0.11"
# Nexus imports: the Nexus REST API and asset downloads, through forge-core's
# upstream client.
reqwest = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
ipnet = { workspace = true }
url = { workspace = true }
argon2 = { workspace = true, features = ["password-hash"] }
tokio-util = { workspace = true }
# Format-plugin uploads: the named file part of a multipart body, streamed.
multer = "3"
# npm audits: a gzip-compressed request body.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# The MaxMind databases of the traffic statistics come as `.tar.gz`.
tar = { version = "0.4", default-features = false }
# The file store: the MD5 of uploads (the `.md5` sidecar), file names in
# headers, HTTP dates (`Last-Modified`, `If-Modified-Since`) and content
# types guessed from file names.
md-5 = "0.11"
percent-encoding = "2.3"
httpdate = "1"
mime_guess = "2"
futures-util = { workspace = true }
async-stream = "0.3"
bytes = "1"
uuid = { workspace = true }
# Registry token signing key generation.
rand = { workspace = true }
# Registry Bearer tokens (HS256), the same crate the OIDC verifier uses.
jsonwebtoken = { workspace = true }
# Outgoing email (invitations): SMTP submission.
lettre = { workspace = true }

# Config: TOML + FORGE_* env overrides.
figment = { version = "0.10", features = ["toml", "env"] }

# The binary's global allocator (main.rs): jemalloc, whose background threads
# hand freed memory back to the system, where glibc's malloc kept it in its
# per-thread arenas. `background_threads` turns them on by default
# (`background_thread:true`); `_RJEM_MALLOC_CONF` overrides it at run time.
# jemalloc refuses to start on a kernel whose pages are larger than the ones
# it was built for; for aarch64 Linux its configure takes 64 KiB, so the arm64
# image also runs on kernels with 16 or 64 KiB pages.
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

[dev-dependencies]
# Small MaxMind databases for the traffic statistics' tests.
forge-traffic = { path = "../traffic", features = ["testing"] }
tar = { version = "0.4", default-features = false }
# Builds Helm chart archives for the registry tests.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "test-util"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
reqwest = { workspace = true, features = ["multipart", "query"] }
forge-format-nuget = { path = "../formats/nuget" }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
figment = { version = "0.10", features = ["toml", "env", "test"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# Mock OIDC IdP for the /auth route integration tests: serve
# discovery/JWKS/token, sign a self-issued ID token with a throwaway RSA key.
# Mirrors the forge-core OIDC test harness.
wiremock = "0.6"
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sqlx = { workspace = true }
# The OpenTelemetry tests: in-memory exporters (tests/telemetry.rs), and a
# mock OTLP/HTTP receiver decoding what is exported (tests/otlp_export.rs).
opentelemetry_sdk = { workspace = true, features = ["testing"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics", "trace", "logs"] }
prost = "0.14"
# A throwaway CA and server certificate for the SMTP-over-TLS tests (mailpit),
# made per run instead of a key kept in the repository.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
