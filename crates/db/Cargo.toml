[package]
name = "forge-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Secret encryption at rest (slice 12.5): the Postgres KeyStore over
# `encryption_key` and the encrypted-column helpers go through forge-crypto.
forge-crypto = { path = "../crypto" }

sqlx = { workspace = true, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# Canonical usernames (NFC) — see `username.rs`.
unicode-normalization = "0.1"
# The `remote_url` origin a sealed upstream password is bound to.
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sqlx = { workspace = true, features = ["json"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
