[package]
name = "forge-core"
version = "0.1.0"
edition = "2021"

[dependencies]
forge-db = { path = "../db" }
forge-storage = { path = "../storage" }
forge-cache = { path = "../cache" }

tokio = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Auth
argon2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }

# Networking / SSRF guard
ipnet = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
forge-db = { path = "../db" }
# dev-only cycle (forge-nuget depends on forge-core); Cargo permits this for the
# version-ordering Format impl used by the hosted-read integration tests.
forge-nuget = { path = "../format-nuget" }
argon2 = { workspace = true, features = ["password-hash"] }
serde_json = { workspace = true }
chrono = { workspace = true }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
axum = { workspace = true }
forge-cache = { path = "../cache" }
