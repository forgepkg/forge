[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forge-db = { path = "../db" }
forge-storage = { path = "../storage" }
forge-cache = { path = "../cache" }
# Secret encryption at rest (slice 12.5): the proxy upstream fetch decrypts the
# upstream password through the envelope service (the single sanctioned site).
forge-crypto = { path = "../crypto" }

tokio = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# RBAC content-selector glob matching (slice 12.4 Phase 2): compile include/exclude
# globs once into a GlobSet held behind Arc in the cached effective set.
globset = { workspace = true }

# Auth
argon2 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# OIDC ID-token verification (slice 12.2 Phase 2): explicit JWT decode + RSA
# JWKS key construction + iss/aud/exp/nonce validation with an alg allowlist.
jsonwebtoken = { workspace = true }

# Networking / SSRF guard
ipnet = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
# Proxy upstream bodies: spooled (memory → temp file) metadata and streamed
# `.nupkg` downloads into the CAS.
tempfile = { workspace = true }
tokio-util = { workspace = true }
# Inflate gzip-encoded upstream metadata (nuget.org's registration5-gz-*
# documents always are). Same backend the zip crate already pulls in.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net"] }
forge-db = { path = "../db" }
# dev-only cycle (forge-nuget depends on forge-core); Cargo permits this for the
# version-ordering Format impl used by the hosted-read integration tests.
forge-nuget = { path = "../format-nuget" }
argon2 = { workspace = true, features = ["password-hash"] }
serde_json = { workspace = true }
chrono = { workspace = true }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
axum = { workspace = true }
forge-cache = { path = "../cache" }
# Mock HTTP server for discovery/JWKS unit tests (no real network).
wiremock = "0.6"
# Generate a throwaway RSA keypair in-test: sign a self-signed ID token and
# publish its public n/e in a static JWKS. Verifier is exercised end-to-end
# without touching the network.
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
rand = { workspace = true }
