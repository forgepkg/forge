[package]
name = "forge-core"
version = "0.1.0"
edition = "2021"

[dependencies]
forge-db = { path = "../db" }

tokio = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }

# Auth
argon2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }

# Networking / SSRF guard
ipnet = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
forge-db = { path = "../db" }
argon2 = { workspace = true, features = ["password-hash"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
