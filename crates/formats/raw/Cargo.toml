[package]
name = "forge-format-raw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Raw file repositories for Forge, a format crate built into the server"

[dependencies]
forge-format-api = { path = "../../format-api" }
# The JSON listing.
serde = { workspace = true }
serde_json = { workspace = true }
# Last-Modified and If-Modified-Since of the checksum sidecars.
httpdate = "1"
# Upstream URLs of a proxy's files, listing queries and links.
url = { workspace = true }
percent-encoding = "2.3"
base64 = { workspace = true }

[dev-dependencies]
forge-format-api = { path = "../../format-api", features = ["testing"] }
