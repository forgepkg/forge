[package]
name = "forge-format-docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Docker / OCI registries for Forge, a format crate built into the server"

[dependencies]
forge-format-api = { path = "../../format-api" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Upstream URLs and the pages a tag list links to.
url = { workspace = true }
# Helm chart archives (.tgz), read for their README and values (`chart`).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
forge-format-api = { path = "../../format-api", features = ["testing"] }
sha2 = { workspace = true }
hex = { workspace = true }
