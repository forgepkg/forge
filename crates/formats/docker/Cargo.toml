[package]
name = "forge-format-docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forge-core = { path = "../../core" }
forge-db = { path = "../../db" }
forge-storage = { path = "../../storage" }
forge-cache = { path = "../../cache" }
forge-crypto = { path = "../../crypto" }

axum = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = "1"
async-trait = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
# Registry Bearer tokens (HS256), the same crate the OIDC verifier uses.
jsonwebtoken = { workspace = true }
rand = { workspace = true }
# Helm chart archives (.tgz), read for their README and values (`chart`).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
