[package]
name = "forge-format-npm"
# The plugin's own version: keep it equal to `version` in plugin.toml.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "npm registries for Forge, as a format plugin"

[dependencies]
forge-plugin-api = { path = "../../plugin-api" }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
# `dist.shasum`, the SHA-1 every npm client still checks.
sha1 = "0.11"
hex = { workspace = true }
base64 = { workspace = true }
# Tarballs: gzip, then tar (read only, never unpacked to disk).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
# npm versions are SemVer 2.0.0 (node-semver), ordered by its precedence.
semver = "1"

[dev-dependencies]
forge-plugin-api = { path = "../../plugin-api", features = ["testing"] }
tempfile = { workspace = true }
