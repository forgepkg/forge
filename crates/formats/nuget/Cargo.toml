[package]
name = "forge-format-nuget"
# The plugin's own version, its descriptor's.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NuGet V3 feeds for Forge, as a format plugin"

[dependencies]
forge-plugin-api = { path = "../../plugin-api" }

thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# ZIP archive reading (.nupkg is a zip); default features keep deflate support.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# Namespace-insensitive XML parsing of the .nuspec manifest.
quick-xml = { version = "0.42" }

[dev-dependencies]
forge-plugin-api = { path = "../../plugin-api", features = ["testing"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
