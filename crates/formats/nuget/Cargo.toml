[package]
name = "forge-format-nuget"
# The plugin's own version, its descriptor's.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NuGet V3 feeds for Forge, as a format plugin"

[dependencies]
forge-plugin-api = { path = "../../plugin-api" }

thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Inflating the .nuspec out of a .nupkg (a zip, whose directory nuspec.rs
# reads itself), and checking its CRC-32.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
# Namespace-insensitive XML parsing of the .nuspec manifest.
quick-xml = { version = "0.42" }

[dev-dependencies]
forge-plugin-api = { path = "../../plugin-api", features = ["testing"] }
# Writing test packages.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
