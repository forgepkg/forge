[package]
name = "forge-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `testing::example_plugin`: builds a plugin of `plugins/` for tests.
testing = []

[dependencies]
forge-core = { path = "../core" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = "0.9"
# The async plugin call awaits a oneshot answer from the plugin threads.
tokio = { workspace = true, features = ["sync"] }
# Spools a package handed over as a reader into a file the plugin can be lent.
tempfile = { workspace = true }

wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
forge-plugin = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
