[package]
name = "forge-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# All e2e harness code + tests are gated behind this feature so a plain
# `cargo build/test --workspace` never pulls in testcontainers / Docker.
# The testcontainers crates are optional deps activated only by this feature,
# so a clean build never resolves, downloads, or compiles them.
forge-e2e = ["dep:testcontainers", "dep:testcontainers-modules"]

[lib]
name = "forge_e2e"
path = "src/lib.rs"

[dependencies]
forge-db = { path = "../db" }
forge-storage = { path = "../storage" }
forge-cache = { path = "../cache" }
forge-core = { path = "../core" }
forge-nuget = { path = "../format-nuget" }
forge-server = { path = "../server" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
axum = { workspace = true }
sqlx = { workspace = true, features = ["migrate"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

reqwest = { workspace = true, features = ["multipart"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
figment = { version = "0.10", features = ["toml"] }
testcontainers = { version = "0.27", optional = true }
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"], optional = true }

# In-process mock OIDC IdP for the slice-12.2 e2e scenarios: an axum app
# serving discovery/JWKS + an authorize endpoint that 302s straight back to the
# forge callback and a token endpoint that signs a test ID token with a
# throwaway RSA key. Mirrors the forge-server route-test harness, but in-process
# (reachable from the real server's SSRF-guarded client at a loopback address).
jsonwebtoken = { workspace = true }
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
tempfile = "3"
