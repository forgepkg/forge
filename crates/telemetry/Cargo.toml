[package]
name = "forge-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The OpenTelemetry API: instruments on the meter forge-server installs
# (without one, recording does nothing). Spans are `tracing` spans, which
# forge-server bridges to OpenTelemetry.
opentelemetry = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# An in-memory exporter to read back what was recorded.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
