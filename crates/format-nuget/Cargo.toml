[package]
name = "forge-nuget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forge-core = { path = "../core" }

thiserror = { workspace = true }
base64 = { workspace = true }

# HTTP routing for the NuGet V3 surface.
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
bytes = "1"
# Bridge the multipart upload field stream into the CAS's AsyncRead.
tokio-util = { workspace = true }
# `spawn_blocking` for rendering large registration documents.
tokio = { workspace = true, features = ["rt"] }
futures-util = { workspace = true }
# Owned async stream so the multipart body can outlive the borrow as a 'static
# reader handed to the CAS.
async-stream = "0.3"

# ZIP archive reading (.nupkg is a zip); default features keep deflate support.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# Namespace-insensitive XML parsing of the .nuspec manifest.
quick-xml = { version = "0.42" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
