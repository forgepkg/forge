name: forge-dev

services:
  # PostgreSQL 17 — metadata store
  db:
    image: mirror.gcr.io/library/postgres:17
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    ports:
      # Host 5433 -> container 5432, to avoid colliding with a Postgres that may
      # already be listening on the host's default 5432. forge.toml points here.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # versitygw — S3-compatible gateway backed by a local POSIX directory.
  #
  # CLI reference (discovered via `docker run --rm versity/versitygw --help`):
  #   versitygw [global options] <backend-command> [backend options]
  #   Global:  --port/-p <addr>  (default ":7070"; we use :8422)
  #            --access/-a <key>   (also ROOT_ACCESS_KEY_ID)
  #            --secret/-s <key>   (also ROOT_SECRET_ACCESS_KEY)
  #   Backend: posix <root-dir>
  #
  # The posix backend treats each subdirectory of <root-dir> as a bucket.
  # versitygw does NOT auto-create the bucket directory — you must create it
  # yourself before (or just after) startup:
  #
  #   docker compose exec s3 mkdir -p /data/forge
  #
  # Or with the AWS CLI against the endpoint:
  #   AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin \
  #     aws s3 mb s3://forge \
  #     --endpoint-url http://localhost:8422 \
  #     --region us-east-1
  s3:
    image: mirror.gcr.io/versity/versitygw:v1.4.1
    command: ["--port", ":8422", "--access", "minioadmin", "--secret", "minioadmin", "posix", "/data"]
    ports:
      - "8422:8422"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8422 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  s3_data:
