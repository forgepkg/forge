name: Audit

# Checks the default branch's Cargo.lock against the RustSec advisory
# database every morning at 9:00 Berlin time, and on demand. CI's `audit` job
# (ci.yml) runs only for a change to Cargo.lock or .cargo/audit.toml, so an
# advisory published for a dependency that no change touches turns up here,
# as a failed run. GitHub notifies the user who created the workflow, or who
# last changed its `cron` line or re-enabled it, of a scheduled run that
# fails: on github.com and by email, as their notification settings for
# Actions say. Fix it as in CI: update the crate, or accept the advisory in
# .cargo/audit.toml with a rationale. Forks do not run it.
on:
  schedule:
    - cron: "0 9 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same steps as ci.yml's `audit` job; keep the cargo-audit pin in line.
  audit:
    name: audit
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'forgepkg/forge' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit (prebuilt, pinned)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cargo audit
