name: Release

# Publishes the production image for a version tag (`v0.1.0`, `v0.1.1`, …):
#   ghcr.io/<owner>/<repo>:<version> and :sha-<short>, plus
#   :<major>.<minor> only for the newest release of that line and :latest only
#   for the newest non-prerelease version overall (an older-line patch or a
#   prerelease never moves them),
# with a BuildKit SBOM + max-mode provenance attestation, a keyless cosign
# signature, and a GitHub release whose notes come from the matching
# CHANGELOG.md section. The Helm chart (deploy/helm/forge) is published next
# to it as oci://ghcr.io/<owner>/charts/forge:<version>, pinned to the signed
# image digest and signed the same way.
#
# Order of operations: the image is pushed BY DIGEST (untagged), the digest is
# signed and the signature verified, and only then are the tags attached
# (`docker buildx imagetools create`), so no tag ever points at an unsigned
# image. Every third-party action is pinned to a full commit SHA (the tag it
# was resolved from is in the trailing comment); Dependabot keeps them current.
#
# Guard rails: the tag must equal the workspace version in Cargo.toml, the
# web/package.json version, the image tag of the Kubernetes base
# (deploy/kubernetes/base) and the Helm chart's version and appVersion, and
# must point at a commit on the default branch. `cargo xtask release
# <version>` sets all of them and creates the tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_DIR: deploy/helm/forge
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
  # Built from source by `go install`, so the Go checksum database verifies
  # it (get.helm.sh publishes no signed checksums we could pin here).
  HELM_VERSION: v4.3.1

jobs:
  image:
    name: build, push, sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag matches the workspace, web, Kubernetes and chart versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          web_version=$(node -p "require('./web/package.json').version")
          k8s_version=$(sed -n 's/^ *newTag: *//p' deploy/kubernetes/base/kustomization.yaml)
          chart_version=$(sed -n 's/^version: *//p' "$CHART_DIR/Chart.yaml")
          chart_app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$CHART_DIR/Chart.yaml")
          echo "tag=$tag cargo=$cargo_version web=$web_version kubernetes=$k8s_version chart=$chart_version chart-app=$chart_app_version"
          for v in "$cargo_version" "$web_version" "$k8s_version" "$chart_version" "$chart_app_version"; do
            if [ "$tag" != "$v" ]; then
              echo "::error::tag v$tag does not match Cargo.toml ($cargo_version) / web/package.json ($web_version) / deploy/kubernetes/base ($k8s_version) / $CHART_DIR ($chart_version, appVersion $chart_app_version); cut releases with 'cargo xtask release $tag'"
              exit 1
            fi
          done
          # The chart's default image must be the one this workflow pushes.
          chart_image="$(sed -n 's/^  registry: *//p' "$CHART_DIR/values.yaml")/$(sed -n 's/^  repository: *//p' "$CHART_DIR/values.yaml")"
          if [ "$chart_image" != "$IMAGE" ]; then
            echo "::error::$CHART_DIR/values.yaml deploys $chart_image, but this workflow publishes $IMAGE"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}" \
            || { echo "::error::tag is not on the default branch"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # Which floating tags this release may move: `latest` only for the
      # highest non-prerelease version and `<major>.<minor>` only for the
      # highest of its line, counting only tags on the default branch (see the
      # script; tested by xtask/tests/release_channels.rs).
      - name: Decide floating tags
        id: channels
        shell: bash # -eo pipefail: a failing script fails the step
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: .github/scripts/release-channels.sh "$VERSION" "$BASE" | tee -a "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # Before anything is pushed, so a chart that does not lint stops the
      # release.
      - name: Install Helm and lint the chart
        run: |
          GOBIN="$RUNNER_TEMP/bin" GOTOOLCHAIN=auto GOFLAGS=-trimpath go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/helm" lint --strict --with-subcharts "$CHART_DIR"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` is decided explicitly above, never automatically.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.channels.outputs.line_latest }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.channels.outputs.latest }}
          labels: |
            org.opencontainers.image.title=envisia-forge
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Push the image untagged (by digest only); the tags are attached after
      # the digest is signed.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FORGE_GIT_SHA=${{ github.sha }}
            FORGE_VERSION=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image digest (keyless) and verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          # The exact command published in the release notes must succeed.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Attach the tags to the signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          echo "tags: ${args[*]}"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          # A single-index source is copied as-is; make sure the tag really
          # resolves to the signed digest.
          tagged=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::${IMAGE}:${VERSION} resolves to $tagged, not the signed $DIGEST"
            exit 1
          fi

      # The packaged chart records the signed digest (Chart.yaml annotation
      # forge.envisia.de/image-digest), so it deploys exactly this image while
      # image.tag and image.digest are left unset. The checkout itself keeps
      # the annotation empty.
      - name: Package the Helm chart, pinned to the signed image digest
        id: chart
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          annotation='  forge.envisia.de/image-digest:'
          if [ "$(grep -cx "${annotation} \"\"" "$CHART_DIR/Chart.yaml")" != 1 ]; then
            echo "::error::$CHART_DIR/Chart.yaml needs exactly one empty '${annotation# }' annotation"
            exit 1
          fi
          sed -i "s|^${annotation} \"\"\$|${annotation} \"${DIGEST}\"|" "$CHART_DIR/Chart.yaml"
          helm package "$CHART_DIR" --destination "$RUNNER_TEMP/chart"
          package="$RUNNER_TEMP/chart/forge-${VERSION}.tgz"
          rendered=$(helm template forge "$package" --show-only templates/deployment.yaml | sed -n 's/^ *image: *//p' | tr -d '"')
          if [ "$rendered" != "${IMAGE}:${VERSION}@${DIGEST}" ]; then
            echo "::error::the packaged chart deploys '$rendered', not ${IMAGE}:${VERSION}@${DIGEST}"
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Push the chart, sign its digest (keyless) and verify the signature
        id: chart-push
        env:
          PACKAGE: ${{ steps.chart.outputs.package }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "$PACKAGE" "oci://${CHART_REPO}" 2>&1 | tee helm-push.log
          digest=$(sed -n 's/^Digest: *//p' helm-push.log)
          if [ -z "$digest" ]; then
            echo "::error::helm push reported no digest"
            exit 1
          fi
          cosign sign --yes "${CHART_REPO}/forge@${digest}"
          cosign verify "${CHART_REPO}/forge@${digest}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart-push.outputs.digest }}
          PACKAGE: ${{ steps.chart.outputs.package }}
        run: |
          {
            cat release-notes.md
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.version.outputs.version }}"
            echo "# digest: ${DIGEST}"
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "### Helm chart"
            echo
            echo "Deploys exactly the image above (by digest)."
            echo
            echo '```'
            echo "helm install forge oci://${CHART_REPO}/forge --version ${{ steps.version.outputs.version }}"
            echo "# digest: ${CHART_DIGEST}"
            echo "cosign verify ${CHART_REPO}/forge@${CHART_DIGEST} \\"
            echo "  --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > release-body.md
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md $prerelease --verify-tag
