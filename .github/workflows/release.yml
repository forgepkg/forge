name: Release

# Publishes the production image for a version tag (`v0.1.0`, `v0.1.1`, …):
#   ghcr.io/<owner>/<repo>:<version> and :sha-<short>, plus
#   :<major>.<minor> only for the newest release of that line and :latest only
#   for the newest non-prerelease version overall (an older-line patch or a
#   prerelease never moves them),
# with a BuildKit SBOM + max-mode provenance attestation, a keyless cosign
# signature, and a GitHub release whose notes come from the matching
# CHANGELOG.md section.
#
# Order of operations: the image is pushed BY DIGEST (untagged), the digest is
# signed and the signature verified, and only then are the tags attached
# (`docker buildx imagetools create`), so no tag ever points at an unsigned
# image. Every third-party action is pinned to a full commit SHA (the tag it
# was resolved from is in the trailing comment); Dependabot keeps them current.
#
# Guard rails: the tag must equal the workspace version in Cargo.toml, the
# web/package.json version and the image tag of the Kubernetes base
# (deploy/kubernetes/base), and must point at a commit on the default branch.
# `cargo xtask release <version>` sets all three and creates the tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build, push, sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag matches the workspace, web and Kubernetes versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          web_version=$(node -p "require('./web/package.json').version")
          k8s_version=$(sed -n 's/^ *newTag: *//p' deploy/kubernetes/base/kustomization.yaml)
          echo "tag=$tag cargo=$cargo_version web=$web_version kubernetes=$k8s_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$web_version" ] || [ "$tag" != "$k8s_version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml ($cargo_version) / web/package.json ($web_version) / deploy/kubernetes/base ($k8s_version); cut releases with 'cargo xtask release $tag'"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}" \
            || { echo "::error::tag is not on the default branch"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # Which floating tags this release may move: `latest` only for the
      # highest non-prerelease version and `<major>.<minor>` only for the
      # highest of its line, counting only tags on the default branch (see the
      # script; tested by xtask/tests/release_channels.rs).
      - name: Decide floating tags
        id: channels
        shell: bash # -eo pipefail: a failing script fails the step
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: .github/scripts/release-channels.sh "$VERSION" "$BASE" | tee -a "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` is decided explicitly above, never automatically.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.channels.outputs.line_latest }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.channels.outputs.latest }}
          labels: |
            org.opencontainers.image.title=envisia-forge
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Push the image untagged (by digest only); the tags are attached after
      # the digest is signed.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FORGE_GIT_SHA=${{ github.sha }}
            FORGE_VERSION=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image digest (keyless) and verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          # The exact command published in the release notes must succeed.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Attach the tags to the signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          echo "tags: ${args[*]}"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          # A single-index source is copied as-is; make sure the tag really
          # resolves to the signed digest.
          tagged=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::${IMAGE}:${VERSION} resolves to $tagged, not the signed $DIGEST"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            cat release-notes.md
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.version.outputs.version }}"
            echo "# digest: ${DIGEST}"
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > release-body.md
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md $prerelease --verify-tag
