name: Release

# Publishes the production image for a version tag (`v0.1.0`, `v0.1.1`, …):
#   ghcr.io/<owner>/<repo>:<version>, :<major>.<minor>, :sha-<short>, :latest
# with a BuildKit SBOM + max-mode provenance attestation, a keyless cosign
# signature over the pushed digest, and a GitHub release whose notes come from
# the matching CHANGELOG.md section.
#
# Guard rails: the tag must equal the workspace version in Cargo.toml and the
# web/package.json version, and must point at a commit on the default branch.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build, push, sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing + provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches the workspace and web versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          web_version=$(node -p "require('./web/package.json').version")
          echo "tag=$tag cargo=$cargo_version web=$web_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$web_version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml ($cargo_version) / web/package.json ($web_version)"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}" \
            || { echo "::error::tag is not on the default branch"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=envisia-forge
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FORGE_GIT_SHA=${{ github.sha }}
            FORGE_VERSION=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            cat release-notes.md
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.version.outputs.version }}"
            echo "# digest: ${DIGEST}"
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > release-body.md
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md $prerelease --verify-tag
