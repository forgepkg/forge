name: CI

# One run per change: pull requests are checked via `pull_request` (which tests
# the merge result), a merge queue's merge groups via `merge_group` (the commit
# that lands; without this trigger a queue waits forever for its required
# checks), and only the default branch runs on `push` (post-merge). Pushing to
# a PR branch no longer triggers a second, identical `push` run. Branches
# without a PR can be checked on demand via `workflow_dispatch`.
on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
  workflow_dispatch:

# Pull requests: a newer commit on the same PR supersedes (cancels) the running
# check. Every other run (a merge group, a push to the default branch, a manual
# run) has a group of its own commit: a concurrency group holds at most one
# pending run and cancels it when a newer one queues, even with
# cancel-in-progress: false, so one group for the default branch would drop
# the run of a commit merged while another was in progress, e2e jobs included,
# and one for the merge queue would leave a queued group without its checks.
# Per commit, every merge gets its own full run, and the release workflow can
# require it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job; nothing in CI writes to the repository.
permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (the tag it was
# resolved from is in the trailing comment); Dependabot
# (.github/dependabot.yml) proposes updates.

env:
  CARGO_TERM_COLOR: always
  # Keep target/ small enough for a hosted runner's disk: a full-debuginfo
  # workspace test build is ~20 GB. Line tables keep file:line in panics and
  # backtraces; incremental artefacts are useless in a one-shot CI build.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Used by sqlx for compile-time query verification from the cached .sqlx/ dir.
  # The `prepare` job overrides this when it needs a live database.
  SQLX_OFFLINE: "true"

jobs:
  # ── Formatting ─────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml) (with rustfmt)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # ── Clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml) (with clippy)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          components: clippy
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Dependency advisories (RustSec) ────────────────────────────────────────
  # Fails on any known vulnerability in Cargo.lock. Accepted advisories, each
  # with a one-line rationale, live in .cargo/audit.toml. Reads only the
  # lockfile (no build), so it is quick and needs no toolchain cache.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit (prebuilt, pinned)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cargo audit

  # ── Format plugins as WebAssembly components (plugins/<id>/) ──────────────
  # The plugins are workspace crates (fmt, clippy and their tests run with the
  # workspace); this checks that each one also lints clean and builds as a
  # component for wasm32-wasip2. The tests that load a component run in `test`.
  plugins:
    name: plugins
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml) (with clippy, wasm32-wasip2)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          components: clippy
          targets: wasm32-wasip2
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-plugins-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-plugins-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo xtask plugins-check
        run: cargo xtask plugins-check

  # ── Unit tests (no containers required) ────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [fmt]

    services:
      # Postgres is provisioned here so we can run `cargo sqlx prepare --check`
      # against a live DB to catch drift between migrations/ and the committed
      # .sqlx/ cache. Unit tests themselves use SQLX_OFFLINE=true. Pinned by
      # digest; Dependabot does not see workflow images, so bump it with
      # deploy/kubernetes/components/postgres.
      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://forge:forge@localhost:5432/forge
      FORGE_DATABASE_URL: postgres://forge:forge@localhost:5432/forge
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          # The format-plugin tests build plugins/ as WebAssembly components.
          targets: wasm32-wasip2
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace
        # forge-e2e feature is intentionally excluded here — unit tests only.
        run: cargo test --workspace

      # sqlx cache drift guard (A1). Runs migrations against the live Postgres
      # service, then verifies the committed .sqlx/ dir matches the current
      # queries + schema. SQLX_OFFLINE is unset here so the check talks to the DB.
      - name: Install sqlx-cli (prebuilt, no source compile)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sqlx-cli@0.9.0
      - name: Run migrations
        env:
          SQLX_OFFLINE: ""
        run: sqlx migrate run --source migrations
      - name: cargo sqlx prepare --check (catch .sqlx drift)
        env:
          SQLX_OFFLINE: ""
        run: cargo sqlx prepare --check --workspace -- --all-targets --all-features

  # ── Container image (build only; releases push from release.yml) ─────────
  # Builds the production Dockerfile on every change so a broken image is
  # caught before a release tag, not by it.
  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The BuildKit release.yml builds with (pinned by digest; keep in step).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: |
            FORGE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Kubernetes manifests (deploy/kubernetes) and Helm chart (deploy/helm) ──
  # Checks that every image reference (Dockerfile, deploy/, the workflows) is
  # pinned by digest; builds every overlay, and the base with each component;
  # lints and renders the chart with each of its ci/ values files; and
  # validates the output against the Kubernetes schemas. kustomize and
  # kubeconform are pinned by checksum, Helm is built from its pinned Go
  # module (verified by the Go checksum database; keep HELM_VERSION in step
  # with release.yml).
  kubernetes:
    name: kubernetes
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: "5.7.1"
      KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8
      KUBECONFORM_VERSION: "0.7.0"
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      HELM_VERSION: v4.3.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image references are pinned by digest
        run: .github/scripts/image-pin-check.sh
      - name: Install kustomize + kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  kustomize.tgz\n%s  kubeconform.tgz\n' "$KUSTOMIZE_SHA256" "$KUBECONFORM_SHA256" | sha256sum -c -
          tar -xzf kustomize.tgz -C bin kustomize
          tar -xzf kubeconform.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and validate
        run: .github/scripts/kustomize-check.sh 1.33.0
      - name: Cache the Helm build
        id: helm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/helm
          key: ${{ runner.os }}-helm-${{ env.HELM_VERSION }}
      - name: Install Helm
        run: |
          if [ "${{ steps.helm-cache.outputs.cache-hit }}" != "true" ]; then
            GOBIN="$RUNNER_TEMP/helm" GOTOOLCHAIN=auto GOFLAGS=-trimpath go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"
          fi
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"
      - name: Lint, render and validate the Helm chart
        run: .github/scripts/helm-check.sh 1.33.0

  # ── Frontend (TanStack Router SPA in web/) ─────────────────────────────────
  # Typecheck + unit/component tests (Vitest + RTL) + production build. The build
  # output (web/dist/) is what the Rust server serves via ServeDir; building here
  # guards against TS/Vite breakage and is a prerequisite for the e2e job.
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.5.0"
          package_json_file: web/package.json
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc --noEmit)
        run: pnpm run tsc
      - name: Unit tests (Vitest)
        run: pnpm run test
      - name: Production build (vite build -> web/dist)
        run: pnpm run build
      # Known-vulnerability check of the shipped (non-dev) web dependencies;
      # the Rust side is covered by the `audit` job.
      - name: Dependency audit (pnpm audit --prod)
        run: pnpm audit --prod
      - name: Upload built SPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ── Docker / OCI registry e2e (real clients against a live server) ─────────
  # Boots forge-server and drives the registry with the OCI distribution-spec
  # conformance suite, docker (buildx multi-arch), crane, a proxy of a
  # registry:2 upstream, a group, and cosign signatures/attestations through
  # the referrers API (.github/scripts/oci-e2e.sh). Runs on pull requests too:
  # it is the only check that the registry still speaks to real clients.
  oci-e2e:
    name: oci-e2e
    runs-on: ubuntu-latest
    needs: [fmt]
    services:
      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLX_OFFLINE: "true"
      CRANE_VERSION: v0.20.2
      COSIGN_VERSION: v3.0.2
      COSIGN_SHA256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd
      # The upstream registry the proxy repository caches, and buildx's
      # BuildKit, pinned like every other image.
      FORGE_E2E_UPSTREAM_IMAGE: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      FORGE_E2E_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-oci-e2e-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-oci-e2e-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install crane and cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # crane: built by `go install`, so the Go checksum database verifies it.
          GOBIN="$RUNNER_TEMP/bin" GOTOOLCHAIN=auto GOFLAGS=-trimpath \
            go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Start the S3 gateway and pull the upstream registry image
        run: |
          docker run -d --name forge-e2e-s3 -p 7070:7070 \
            versity/versitygw:v1.4.1@sha256:0400cb59f59da0f1cf9f7fd49505191abc348dfadf54509bf1988caaff4eb96f \
            --port :7070 --access forge-e2e-key --secret forge-e2e-secret posix /tmp
          docker pull "$FORGE_E2E_UPSTREAM_IMAGE"
      - name: cargo build -p forge-server
        run: cargo build -p forge-server --bin forge-server
      - name: Registry e2e (conformance, docker, crane, proxy, group, cosign)
        env:
          GOTOOLCHAIN: auto
        run: .github/scripts/oci-e2e.sh target/debug/forge-server oci-e2e-results
      - name: Upload the conformance report and server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-e2e-results
          path: oci-e2e-results
          retention-days: 7

  # ── E2E / integration tests (forge-e2e crate, testcontainers) ──────────────
  # The forge-e2e harness boots its OWN Postgres + versitygw (+ Redis, and a
  # MinIO for the S3 web identity scenarios) containers via testcontainers — the ubuntu-latest runner ships a working
  # Docker daemon, so no `services:` are needed. Gated behind the `forge-e2e`
  # feature. The optional dotnet smoke test runs because actions/setup-dotnet
  # provisions the SDK.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Skipped on pull requests to keep them fast (a skipped job passes a
    # required check); runs in the merge queue, so a change that breaks it
    # never lands, and on main/master. release.yml refuses a tag unless this
    # and web-e2e passed on its commit.
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          # The format-plugin tests build plugins/ as WebAssembly components.
          targets: wasm32-wasip2
      - name: Install .NET SDK (for the optional dotnet smoke test)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-${{ hashFiles('rust-toolchain.toml') }}-

      # Pre-pull the images the testcontainers harness uses (deterministic).
      # By tag, not digest: the harness names them by tag in its code
      # (crates/e2e), so a digest here would not decide what it runs
      # (.github/scripts/image-pin-check.sh leaves `docker pull` alone).
      - name: Pre-pull container images
        run: |
          docker pull postgres:17
          docker pull versity/versitygw:v1.4.1
          docker pull redis:5.0
          docker pull pgsty/minio:RELEASE.2026-08-04T00-00-00Z

      - name: Run e2e tests (forge-e2e feature)
        run: cargo test --workspace --features forge-e2e

  # ── Frontend e2e (Playwright drives the Rust server serving the built UI) ────
  # Boots Postgres + versitygw via docker compose, builds the SPA + server, and
  # runs the browser specs. Like e2e, only in the merge queue and on the default
  # branch (slow; needs Docker + browsers).
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.5.0"
          package_json_file: web/package.json
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-web-e2e-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-e2e-${{ hashFiles('rust-toolchain.toml') }}-
      # By tag, like the e2e job: web/e2e names them by tag.
      - name: Pre-pull container images
        run: |
          docker pull postgres:17
          docker pull versity/versitygw:v1.4.1
      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Run Playwright e2e
        run: pnpm run e2e
        working-directory: web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
