name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Used by sqlx for compile-time query verification from the cached .sqlx/ dir.
  # The `prepare` job overrides this when it needs a live database.
  SQLX_OFFLINE: "true"

jobs:
  # ── Formatting ─────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (with rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # ── Clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Unit tests (no containers required) ────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [fmt]

    services:
      # Postgres is provisioned here so we can run `cargo sqlx prepare --check`
      # against a live DB to catch drift between migrations/ and the committed
      # .sqlx/ cache. Unit tests themselves use SQLX_OFFLINE=true.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://forge:forge@localhost:5432/forge
      FORGE_DATABASE_URL: postgres://forge:forge@localhost:5432/forge
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace
        # forge-e2e feature is intentionally excluded here — unit tests only.
        run: cargo test --workspace

      # sqlx cache drift guard (A1). Runs migrations against the live Postgres
      # service, then verifies the committed .sqlx/ dir matches the current
      # queries + schema. SQLX_OFFLINE is unset here so the check talks to the DB.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.8 --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        env:
          SQLX_OFFLINE: ""
        run: sqlx migrate run --source migrations
      - name: cargo sqlx prepare --check (catch .sqlx drift)
        env:
          SQLX_OFFLINE: ""
        run: cargo sqlx prepare --check --workspace -- --all-targets --all-features

  # ── Frontend (TanStack Start SPA in web/) ──────────────────────────────────
  # Typecheck + unit/component tests (Vitest + RTL) + production build. The build
  # output (web/dist/) is what the Rust server serves via ServeDir; building here
  # guards against TS/Vite breakage and is a prerequisite for the e2e job.
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.0"
          package_json_file: web/package.json
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc --noEmit)
        run: pnpm run tsc
      - name: Unit tests (Vitest)
        run: pnpm run test
      - name: Production build (vite build -> web/dist)
        run: pnpm run build
      - name: Upload built SPA
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ── E2E / integration tests (forge-e2e crate, testcontainers) ──────────────
  # The forge-e2e harness boots its OWN Postgres + versitygw (+ Redis)
  # containers via testcontainers — the ubuntu-latest runner ships a working
  # Docker daemon, so no `services:` are needed. Gated behind the `forge-e2e`
  # feature. The optional dotnet smoke test runs because actions/setup-dotnet
  # provisions the SDK.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Only run on pushes to main/master; skipping on every PR keeps CI fast.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install .NET SDK (for the optional dotnet smoke test)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      # Pre-pull the images the testcontainers harness uses (deterministic).
      - name: Pre-pull container images
        run: |
          docker pull postgres:17
          docker pull versity/versitygw:v1.4.1
          docker pull redis:5.0

      - name: Run e2e tests (forge-e2e feature)
        run: cargo test --workspace --features forge-e2e

  # ── Frontend e2e (Playwright drives the Rust server serving the built UI) ────
  # Boots Postgres + versitygw via docker compose, builds the SPA + server, and
  # runs the browser specs. Default-branch only (slow; needs Docker + browsers).
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.0"
          package_json_file: web/package.json
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-web-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-e2e-
      - name: Pre-pull container images
        run: |
          docker pull postgres:17
          docker pull versity/versitygw:v1.4.1
      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Run Playwright e2e
        run: pnpm run e2e
        working-directory: web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
