name: CI

# One run per change: pull requests are checked via `pull_request` (which tests
# the merge result), and only the default branch runs on `push` (post-merge +
# the main-only e2e jobs). Pushing to a PR branch no longer triggers a second,
# identical `push` run. Branches without a PR can be checked on demand via
# `workflow_dispatch`.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR / branch supersedes the running check.
# Default-branch runs are never cancelled, so every merge is fully verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job; nothing in CI writes to the repository.
permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (the tag it was
# resolved from is in the trailing comment); Dependabot
# (.github/dependabot.yml) proposes updates.

env:
  CARGO_TERM_COLOR: always
  # Keep target/ small enough for a hosted runner's disk: a full-debuginfo
  # workspace test build is ~20 GB. Line tables keep file:line in panics and
  # backtraces; incremental artefacts are useless in a one-shot CI build.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Used by sqlx for compile-time query verification from the cached .sqlx/ dir.
  # The `prepare` job overrides this when it needs a live database.
  SQLX_OFFLINE: "true"

jobs:
  # ── Formatting ─────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain (rust-toolchain.toml) (with rustfmt)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # ── Clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain (rust-toolchain.toml) (with clippy)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
        with:
          components: clippy
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Dependency advisories (RustSec) ────────────────────────────────────────
  # Fails on any known vulnerability in Cargo.lock. Accepted advisories, each
  # with a one-line rationale, live in .cargo/audit.toml. Reads only the
  # lockfile (no build), so it is quick and needs no toolchain cache.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-audit (prebuilt, pinned)
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cargo audit

  # ── Unit tests (no containers required) ────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [fmt]

    services:
      # Postgres is provisioned here so we can run `cargo sqlx prepare --check`
      # against a live DB to catch drift between migrations/ and the committed
      # .sqlx/ cache. Unit tests themselves use SQLX_OFFLINE=true.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://forge:forge@localhost:5432/forge
      FORGE_DATABASE_URL: postgres://forge:forge@localhost:5432/forge
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace
        # forge-e2e feature is intentionally excluded here — unit tests only.
        run: cargo test --workspace

      # sqlx cache drift guard (A1). Runs migrations against the live Postgres
      # service, then verifies the committed .sqlx/ dir matches the current
      # queries + schema. SQLX_OFFLINE is unset here so the check talks to the DB.
      - name: Install sqlx-cli (prebuilt, no source compile)
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: sqlx-cli@0.9.0
      - name: Run migrations
        env:
          SQLX_OFFLINE: ""
        run: sqlx migrate run --source migrations
      - name: cargo sqlx prepare --check (catch .sqlx drift)
        env:
          SQLX_OFFLINE: ""
        run: cargo sqlx prepare --check --workspace -- --all-targets --all-features

  # ── Container image (build only; releases push from release.yml) ─────────
  # Builds the production Dockerfile on every change so a broken image is
  # caught before a release tag, not by it.
  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          build-args: |
            FORGE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Frontend (TanStack Router SPA in web/) ─────────────────────────────────
  # Typecheck + unit/component tests (Vitest + RTL) + production build. The build
  # output (web/dist/) is what the Rust server serves via ServeDir; building here
  # guards against TS/Vite breakage and is a prerequisite for the e2e job.
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: "11.5.0"
          package_json_file: web/package.json
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc --noEmit)
        run: pnpm run tsc
      - name: Unit tests (Vitest)
        run: pnpm run test
      - name: Production build (vite build -> web/dist)
        run: pnpm run build
      # Known-vulnerability check of the shipped (non-dev) web dependencies;
      # the Rust side is covered by the `audit` job.
      - name: Dependency audit (pnpm audit --prod)
        run: pnpm audit --prod
      - name: Upload built SPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ── E2E / integration tests (forge-e2e crate, testcontainers) ──────────────
  # The forge-e2e harness boots its OWN Postgres + versitygw (+ Redis)
  # containers via testcontainers — the ubuntu-latest runner ships a working
  # Docker daemon, so no `services:` are needed. Gated behind the `forge-e2e`
  # feature. The optional dotnet smoke test runs because actions/setup-dotnet
  # provisions the SDK.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Only run on pushes to main/master; skipping on every PR keeps CI fast.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
      - name: Install .NET SDK (for the optional dotnet smoke test)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-${{ hashFiles('rust-toolchain.toml') }}-

      # Pre-pull the images the testcontainers harness uses (deterministic).
      - name: Pre-pull container images
        run: |
          docker pull postgres:17
          docker pull versity/versitygw:v1.4.1
          docker pull redis:5.0

      - name: Run e2e tests (forge-e2e feature)
        run: cargo test --workspace --features forge-e2e

  # ── Frontend e2e (Playwright drives the Rust server serving the built UI) ────
  # Boots Postgres + versitygw via docker compose, builds the SPA + server, and
  # runs the browser specs. Default-branch only (slow; needs Docker + browsers).
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a # 1.95.0
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: "11.5.0"
          package_json_file: web/package.json
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-web-e2e-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-e2e-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Pre-pull container images
        run: |
          docker pull postgres:17
          docker pull versity/versitygw:v1.4.1
      - name: Install deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Run Playwright e2e
        run: pnpm run e2e
        working-directory: web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
