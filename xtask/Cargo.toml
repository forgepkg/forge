# xtask — the single task runner for Forge.
#
# `cargo xtask <cmd>` (alias in .cargo/config.toml) replaces the old Makefile +
# Justfile. It is a plain Rust binary that shells out to docker/cargo/pnpm/sqlx
# via std::process::Command and streams their output. Deliberately ZERO external
# dependencies (hand-rolled arg parsing) so the offline workspace build stays
# trivially green and the runner compiles fast.
[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
