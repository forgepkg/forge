# An Ingress in front of the forge Service, with TLS. Overlays set the host
# (spec.rules[0].host, spec.tls[0].hosts[0]) and, if needed, ingressClassName.
#
# List the ingress controller's pod network in FORGE_AUTH__TRUSTED_PROXY_CIDRS,
# or every request appears to come from the controller (the login lockout then
# sees a single client), and add ../network-policy so that nothing else in
# that range reaches Forge.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

labels:
  - pairs:
      app.kubernetes.io/part-of: forge

resources:
  - ingress.yaml
