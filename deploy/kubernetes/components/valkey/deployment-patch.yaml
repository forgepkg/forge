apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge
spec:
  template:
    spec:
      containers:
        - name: forge
          env:
            # $(VALKEY_PASSWORD) expands from the forge-env Secret (envFrom).
            # Valkey speaks the Redis protocol, hence redis://.
            - name: FORGE_REDIS__URL
              value: redis://:$(VALKEY_PASSWORD)@forge-valkey:6379
