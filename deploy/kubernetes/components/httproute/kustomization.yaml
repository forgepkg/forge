# A Gateway API HTTPRoute to the forge Service, for clusters that use a
# Gateway instead of an Ingress. Overlays point parentRefs at their Gateway
# and set the hostname.
#
# Request size limits and timeouts are implementation-specific (Envoy Gateway
# BackendTrafficPolicy / ClientTrafficPolicy, Istio, Cilium, …). Allow pushes
# of server.max_upload_bytes (512 MiB) and image layers of
# docker.max_blob_bytes (1 GiB), and keep the upstream idle timeout below
# server.header_read_timeout_seconds (150 s): Envoy and Istio default to
# 1 hour, which makes the proxy reuse connections Forge is closing (502).
#
# List the gateway's pod network in FORGE_AUTH__TRUSTED_PROXY_CIDRS, and add
# ../network-policy, patched to the namespace of the gateway's data plane, so
# that nothing else in that range reaches Forge.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

labels:
  - pairs:
      app.kubernetes.io/part-of: envisia-forge

resources:
  - httproute.yaml
