# Only the ingress controller or gateway reaches Forge (where the CNI enforces
# NetworkPolicy); see kustomization.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge
  labels:
    app.kubernetes.io/name: forge
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forge
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        # PLACEHOLDER: the namespace of your ingress controller or gateway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
          protocol: TCP
    - from:
        # PLACEHOLDER: the namespace of your Prometheus (or other scraper).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: metrics
          protocol: TCP
