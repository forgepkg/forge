apiVersion: v1
kind: Service
metadata:
  name: forge-postgres
  labels:
    app.kubernetes.io/name: forge-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forge-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forge-postgres
  labels:
    app.kubernetes.io/name: forge-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: forge-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # The image's `postgres` user.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Docker Hub's library/postgres, mirrored to ghcr.io under the same
          # digest (.github/workflows/mirror-images.yml). Pinned by digest;
          # Dependabot bumps tag and digest together.
          image: ghcr.io/schmitch/forge/postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
          env:
            - name: POSTGRES_DB
              value: forge
            - name: POSTGRES_USER
              value: forge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forge-env
                  key: POSTGRES_PASSWORD
            # A subdirectory, so a volume's lost+found does not stop initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: [pg_isready, -U, forge, -d, forge]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, forge, -d, forge]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Parallel queries use POSIX shared memory; the runtime default is 64 MiB.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# Only Forge reaches the database (where the CNI enforces NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-postgres
  labels:
    app.kubernetes.io/name: forge-postgres
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forge-postgres
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: forge
              app.kubernetes.io/component: server
      ports:
        - port: 5432
          protocol: TCP
