apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge
spec:
  template:
    spec:
      containers:
        - name: forge
          env:
            # $(REDIS_PASSWORD) expands from the forge-env Secret (envFrom).
            - name: FORGE_REDIS__URL
              value: redis://:$(REDIS_PASSWORD)@forge-redis:6379
