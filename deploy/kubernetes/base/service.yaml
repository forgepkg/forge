apiVersion: v1
kind: Service
metadata:
  name: forge
  labels:
    app.kubernetes.io/name: forge
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forge
    app.kubernetes.io/component: server
  ports:
    # API, NuGet feed and web UI share this one port.
    - name: http
      port: 8421
      targetPort: http
      protocol: TCP
    # Prometheus metrics, for a scraper (../components/metrics); never routed.
    - name: metrics
      port: 9421
      targetPort: metrics
      protocol: TCP
