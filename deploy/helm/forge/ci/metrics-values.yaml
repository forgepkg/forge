# CI: the metrics behind a bearer token on a port of their own, scraped by a
# ServiceMonitor and a PodMonitor, and admitted by the NetworkPolicy from the
# monitoring namespace only.
host: forge.example.com
secretEnv:
  FORGE_ROOT_KEY: check-only
  FORGE_SERVER__METRICS_TOKEN: check-only-metrics-token
config:
  metrics:
    per_repository: false
metrics:
  port: 9500
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 15s
    scrapeTimeout: 10s
    bearerTokenSecret:
      name: forge-secret-env
      key: FORGE_SERVER__METRICS_TOKEN
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: forge_http_response_bytes_total
        action: drop
  podMonitor:
    enabled: true
    bearerTokenSecret:
      name: forge-secret-env
      key: FORGE_SERVER__METRICS_TOKEN
networkPolicy:
  enabled: true
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
