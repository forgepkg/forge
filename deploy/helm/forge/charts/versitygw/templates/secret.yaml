{{- if not .Values.auth.existingSecret }}
{{- $name := include "forge-versitygw.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{ $data = $existing.data }}{{ end }}
{{- $keys := dict }}
{{- range $field, $length := dict "accessKey" 20 "secretKey" 40 }}
{{- $key := index $.Values.auth (printf "%sKey" $field) }}
{{- $value := index $.Values.auth $field }}
{{- if not $value }}
{{- if hasKey $data $key }}
{{- $value = index $data $key | b64dec }}
{{- else }}
{{- $value = randAlphaNum $length }}
{{- end }}
{{- end }}
{{- $_ := set $keys $key $value }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge-versitygw.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall` like the data volume it belongs to.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $keys }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
