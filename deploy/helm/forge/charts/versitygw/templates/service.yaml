apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge-versitygw.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge-versitygw.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "forge-versitygw.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.port }}
      targetPort: s3
      protocol: TCP
