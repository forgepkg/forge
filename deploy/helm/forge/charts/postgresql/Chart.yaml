# A single PostgreSQL instance for Forge, for evaluation and small installs
# (no backups, replication or failover). Enabled with `postgresql.enabled` in
# the forge chart, which then sets FORGE_DATABASE__URL.
apiVersion: v2
name: postgresql
description: Single-instance PostgreSQL for Forge (evaluation / small installs)
type: application
version: 1.0.0
appVersion: "17"
