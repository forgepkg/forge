{{- if not .Values.auth.existingSecret }}
{{- $name := include "forge-postgresql.fullname" . }}
{{- $password := .Values.auth.password }}
{{- if not $password }}
{{- /* Keep the generated password: PostgreSQL sets it only on the first start. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.auth.secretKey) }}
{{- $password = index $existing.data .Values.auth.secretKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge-postgresql.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall` like the data volume it belongs to.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ $password | b64enc | quote }}
{{- end }}
