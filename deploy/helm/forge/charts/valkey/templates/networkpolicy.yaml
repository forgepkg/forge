{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forge-valkey.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge-valkey.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "forge-valkey.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # This release's Forge pods.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: server
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: valkey
          protocol: TCP
{{- end }}
