{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "forge-valkey.fullname" . }}
{{- $password := .Values.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.auth.secretKey) }}
{{- $password = index $existing.data .Values.auth.secretKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge-valkey.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ $password | b64enc | quote }}
  # Salts the checksum/auth pod annotation (forge-valkey.authChecksum).
  checksum-salt: {{ include "forge-valkey.checksumSalt" . | b64enc | quote }}
{{- end }}
