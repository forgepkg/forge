# Forge Helm chart.
#
# `version` and `appVersion` are the release version: `cargo xtask release
# <version>` sets both, the release workflow refuses a tag whose chart names
# another version, and the image tag defaults to `appVersion`.
apiVersion: v2
name: forge
description: Self-hosted NuGet, Docker / OCI and Helm registry (hosted, proxy and group repositories)
type: application
version: 2.1.1
appVersion: "2.1.1"
kubeVersion: ">=1.30.0-0"
home: https://github.com/forgepkg/forge
sources:
  - https://github.com/forgepkg/forge
keywords:
  - nuget
  - docker
  - oci
  - helm
  - registry
  - package-registry
annotations:
  artifacthub.io/license: MIT
  # The digest of the appVersion image. Empty here; the release workflow sets
  # it to the digest it signed before it publishes the chart
  # (oci://ghcr.io/forgepkg/charts/forge), so the published chart always pulls
  # exactly that image (unless image.tag or image.digest is set).
  forge/image-digest: ""

# Optional in-cluster backing services for evaluation and small installs,
# shipped inside this chart (charts/). Each one is off by default; production
# installs point Forge at a managed PostgreSQL, object store and Valkey or
# Redis.
dependencies:
  - name: postgresql
    version: 1.0.0
    condition: postgresql.enabled
  - name: valkey
    version: 1.0.0
    condition: valkey.enabled
  - name: versitygw
    version: 1.0.0
    condition: versitygw.enabled
