apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "forge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
  {{- with include "forge.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  # Loaded through FORGE_CONFIG; FORGE_* environment variables override it.
  forge.toml: |
    {{- include "forge.config" . | nindent 4 }}
