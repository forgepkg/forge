# Dedicated infra for the Playwright e2e suite.
#
# Isolated from the dev `docker-compose.yml` by a distinct project name
# (`forge-web-e2e`, set via -p in harness.ts) and distinct host ports
# (Postgres 25432, versitygw 27070; below the ephemeral port range, see
# harness.ts) so running e2e never disturbs a dev stack.
#
# Mirrors the slice-1 testcontainers harness (crates/e2e/src/stack.rs): the same
# Postgres 17 and versity/versitygw:v1.4.1 images, the same credentials shape.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: versity/versitygw:v1.4.1
    # posix backend over /tmp (always present in the image), matching the
    # slice-1 testcontainers harness. The server's ensure_bucket() creates the
    # bucket subdirectory on boot.
    command:
      ["--port", ":7070", "--access", "test", "--secret", "test", "posix", "/tmp"]
    ports:
      - "27070:7070"
