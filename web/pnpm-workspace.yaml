packages:
  - '.'

# Supply-chain hardening: hold back package versions published within the last
# 7 days (7 * 24 * 60 = 10080 minutes). Newly published versions are a common
# vector for compromised releases; the cooldown gives time for detection.
minimumReleaseAge: 10080

# source-map-js before 1.2.2 lets indexed source-map section offsets stall the
# event loop (GHSA-68fv-2mgg-jv7q), and @tailwindcss/node 4.3.3 still accepts
# 1.2.1. Drop this once Tailwind asks for 1.2.2 or later itself.
overrides:
  source-map-js: ^1.2.2

# pnpm blocks dependency install/build scripts by default. List only the
# packages that legitimately need to run a build script during install.
onlyBuiltDependencies:
  - esbuild
