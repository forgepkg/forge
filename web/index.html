<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>envisia forge</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light flash.
      // Mirrors lib/theme.ts: 'dark' | 'light' | 'system' (default) from
      // localStorage, with 'system' following prefers-color-scheme.
      ;(function () {
        try {
          var t = localStorage.getItem('forge.theme')
          var dark =
            t === 'dark' ||
            ((t === null || t === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* no storage / no matchMedia: stay light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
