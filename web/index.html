<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/forge-mark.svg" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      // Mirrors lib/theme.ts: 'light' | 'dark-rail' | 'dark' | 'system'
      // (default) from localStorage, with 'system' following
      // prefers-color-scheme between light and dark.
      ;(function () {
        try {
          var t = localStorage.getItem('forge.theme')
          if (t !== 'light' && t !== 'dark-rail' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light'
        } catch (e) {
          /* no storage / no matchMedia: stay light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
