# Forge — baked-in container base configuration.
#
# This file ships INSIDE the Docker image at /app/forge.toml and is loaded via
# $FORGE_CONFIG. It carries only NON-SECRET, deployment-stable defaults. Every
# value can be overridden by a FORGE_* environment variable using double-
# underscore nesting (e.g. FORGE_DATABASE__URL, FORGE_S3__ACCESS_KEY).
#
# Secrets and per-deployment endpoints are intentionally OMITTED here and MUST
# be supplied at runtime via env:
#   FORGE_DATABASE__URL   FORGE_S3__ENDPOINT   FORGE_S3__BUCKET
#   FORGE_S3__ACCESS_KEY  FORGE_S3__SECRET_KEY
#   FORGE_CRYPTO__ROOT__PROVIDER=env with FORGE_ROOT_KEY (the root key of the
#   secret encryption, `openssl rand -base64 32`), or
#   FORGE_CRYPTO__ROOT__PROVIDER=file with FORGE_CRYPTO__ROOT__ROOT_KEY_PATH
# (or, instead of the two keys, short-lived credentials: FORGE_S3__CREDENTIALS
# = default_chain | web_identity; see docs/deployment.md)
# and you should set:
#   FORGE_SERVER__PUBLIC_BASE_URL
#
# The first-run bootstrap admin is configured ONLY through env and exists only
# while a password is set:
#   FORGE_AUTH__BOOTSTRAP_ADMIN__USERNAME   a UPN (default admin@example.com)
#   FORGE_AUTH__BOOTSTRAP_ADMIN__PASSWORD
# No password configured = no bootstrap admin, so removing the variable after
# the first start (docs/deployment.md) is safe and the image keeps starting.
#
# FAIL-CLOSED: without S3 keys (and without short-lived credentials) startup
# fails, and the placeholder S3 keys `minioadmin` and a bootstrap password of
# "changeme" are refused unless the deployment explicitly opts in with
# FORGE_SERVER__ALLOW_INSECURE_DEFAULTS=true (local compose/dev only — see
# docker-compose.app.yml).

[server]
# Listen on all interfaces inside the container; EXPOSE 8421 in the Dockerfile.
bind = "0.0.0.0:8421"
# Override per-deployment with FORGE_SERVER__PUBLIC_BASE_URL so the NuGet V3
# service index emits correct absolute @id URLs behind your real hostname.
public_base_url = "http://localhost:8421"
# Keep false in the image: the placeholders below must be replaced at runtime.
# Only a local dev stack sets FORGE_SERVER__ALLOW_INSECURE_DEFAULTS=true.
allow_insecure_defaults = false

[database]
# Placeholder — MUST be overridden via FORGE_DATABASE__URL at runtime.
url = "postgres://forge:forge@db:5432/forge"

[s3]
# Placeholders — override the endpoint/bucket via FORGE_S3__* at runtime. No
# keys here: FORGE_S3__ACCESS_KEY / FORGE_S3__SECRET_KEY, or
# FORGE_S3__CREDENTIALS for short-lived credentials (which refuse keys).
endpoint = "http://s3:8422"
region = "us-east-1"
bucket = "forge"
force_path_style = true

[auth]
# Anonymous access and password Basic authentication are not set here: an
# administrator sets them in the web UI (Admin → Settings), for every instance
# at once. A new install starts with both off: every request authenticates,
# NuGet clients and scripts use API tokens, and the web UI signs in through
# /auth/login.

# No [auth.bootstrap_admin] block: see the header (env only).

[web]
# The server serves the built SPA from here (also set via FORGE_WEB__ASSETS_DIR
# in the Dockerfile). Matches where stage 1's web/dist is copied in the image.
enabled = true
assets_dir = "/app/web/dist"
