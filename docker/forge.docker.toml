# envisia-forge — baked-in container base configuration.
#
# This file ships INSIDE the Docker image at /app/forge.toml and is loaded via
# $FORGE_CONFIG. It carries only NON-SECRET, deployment-stable defaults. Every
# value can be overridden by a FORGE_* environment variable using double-
# underscore nesting (e.g. FORGE_DATABASE__URL, FORGE_S3__ACCESS_KEY).
#
# Secrets and per-deployment endpoints are intentionally OMITTED here and MUST
# be supplied at runtime via env:
#   FORGE_DATABASE__URL   FORGE_S3__ENDPOINT   FORGE_S3__BUCKET
#   FORGE_S3__ACCESS_KEY  FORGE_S3__SECRET_KEY
# and you should set:
#   FORGE_SERVER__PUBLIC_BASE_URL   FORGE_AUTH__BOOTSTRAP_ADMIN__PASSWORD

[server]
# Listen on all interfaces inside the container; EXPOSE 3000 in the Dockerfile.
bind = "0.0.0.0:3000"
# Override per-deployment with FORGE_SERVER__PUBLIC_BASE_URL so the NuGet V3
# service index emits correct absolute @id URLs behind your real hostname.
public_base_url = "http://localhost:3000"

[database]
# Placeholder — MUST be overridden via FORGE_DATABASE__URL at runtime.
url = "postgres://forge:forge@db:5432/forge"

[s3]
# Placeholders — override the endpoint/keys/bucket via FORGE_S3__* at runtime.
endpoint = "http://s3:7070"
region = "us-east-1"
bucket = "forge"
access_key = "minioadmin"
secret_key = "minioadmin"
force_path_style = true

[auth]
# "all" makes unauthenticated requests an Anonymous principal; a repo must ALSO
# be created with anonymous_read=true to actually grant anonymous reads. Set to
# "off" via FORGE_AUTH__ANONYMOUS_MODE=off for a fully authenticated deployment.
anonymous_mode = "all"
# Allow HTTP Basic password auth so the bootstrap admin can reach the admin API.
allow_password_basic = true

# First-run admin, created only if no admin exists yet. CHANGE THE PASSWORD via
# FORGE_AUTH__BOOTSTRAP_ADMIN__PASSWORD before exposing the server.
[auth.bootstrap_admin]
username = "admin"
password = "changeme"

[web]
# The server serves the built SPA from here (also set via FORGE_WEB__ASSETS_DIR
# in the Dockerfile). Matches where stage 1's web/dist is copied in the image.
enabled = true
assets_dir = "/app/web/dist"
