[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/storage",
    "crates/cache",
    "crates/core",
    "crates/crypto",
    "crates/format-nuget",
    "crates/server",
    "crates/e2e",
    "xtask",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

# Stream <-> AsyncRead bridge (multipart upload field -> CAS)
tokio-util = { version = "0.7", features = ["io"] }

# HTTP framework
axum = { version = "0.8" }

# Static file serving (SPA assets + index.html fallback)
tower-http = { version = "0.6", features = ["fs"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono",
    "uuid",
] }

# UUIDs (retention run grouping)
uuid = { version = "1", features = ["v4", "serde"] }

# S3
aws-sdk-s3 = { version = "1.85" }
aws-config = { version = "1.8" }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# In-memory cache
moka = { version = "0.12", features = ["future"] }

# Glob matching for RBAC content selectors (slice 12.4): compile a GlobSet once
# per selector and match lowercased package names. Audited, standard choice.
globset = { version = "0.4" }

# Redis (optional)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Futures combinators (Stream adapters for redis pub/sub)
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Error handling
anyhow = { version = "1" }
thiserror = { version = "2" }

# Tracing / logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Hashing
sha2 = { version = "0.10" }

# Keyed hashing (validated-credential cache key: HMAC-SHA256 with a server pepper)
hmac = { version = "0.12" }

# Hex encoding (token hashes)
hex = { version = "0.4" }

# Password hashing (PHC argon2 verification)
argon2 = { version = "0.5" }

# Constant-time comparison
subtle = { version = "2.6" }

# AEAD ciphers for secret encryption at rest (slice 12.5). AES-256-GCM is the
# default (hardware-accelerated, KMS-friendly); XChaCha20-Poly1305 is the
# opt-in alternative whose 192-bit extended nonce makes pure-random nonces
# collision-safe without any per-key counter state.
aes-gcm = { version = "0.10" }
chacha20poly1305 = { version = "0.10" }

# Scrub unwrapped key bytes / transient plaintext from memory on drop (12.5).
zeroize = { version = "1.8" }

# Secret wrappers that redact Debug/Display and zeroize on drop (12.5): the
# plaintext-secret type handed to callers so it can never leak into logs.
secrecy = { version = "0.10" }

# CSPRNG for token secrets
rand = { version = "0.8" }

# CIDR / IP network parsing (anon allowlist, SSRF guard)
ipnet = { version = "2.10" }

# URL parsing (SSRF guard)
url = { version = "2.5" }

# HTTP types (HeaderMap for principal sources)
http = { version = "1" }

# async fn in dyn traits (PrincipalSource, SSRF resolver)
async-trait = { version = "0.1" }

# Base64 (RFC 4648 standard alphabet)
base64 = { version = "0.22" }

# JWT decode/verify (OIDC ID-token signature + claim validation, slice 12.2).
# We use `jsonwebtoken` (not the heavier `openidconnect`) for Phase 2: it gives
# explicit control over the signing-key (RSA n/e from JWKS), the algorithm
# allowlist (reject `alg: none`/HMAC), and the iss/aud/exp leeway — and it slots
# cleanly behind the existing SSRF `guarded_client` + `forge-cache` rather than
# bringing its own HTTP-client abstraction.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }

# Temp files
tempfile = { version = "3" }

# Date/time (shared with forge-db's model types)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
