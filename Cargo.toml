[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/storage",
    "crates/cache",
    "crates/core",
    "crates/crypto",
    "crates/plugin-api",
    "crates/plugin",
    "crates/format-oci",
    "crates/server",
    "crates/e2e",
    "plugins/helm",
    "plugins/nuget",
    "xtask",
]

# One version for the whole product: every crate inherits it, so a release
# bumps it here once (and `web/package.json` to match).
[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.95"
# AGPL v3 or the envisia license, at the user's choice (see README → License).
license = "AGPL-3.0-only OR LicenseRef-envisia"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

# Stream <-> AsyncRead bridge (multipart upload field -> CAS)
tokio-util = { version = "0.7", features = ["io"] }

# HTTP framework
axum = { version = "0.8" }

# Static file serving (SPA assets + index.html fallback)
tower-http = { version = "0.7", features = ["fs", "trace", "set-header", "timeout"] }

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono",
    "uuid",
] }

# UUIDs (retention run grouping)
uuid = { version = "1", features = ["v4", "serde"] }

# S3. `default-features = false` drops the SDK's `rustls` feature, which only
# compiles in the legacy hyper 0.14 / rustls 0.21 / h2 0.3 connector (never
# used: the default HTTPS client is hyper 1 / rustls 0.23) and with it
# RUSTSEC-2026-0258 (h2 0.3) and RUSTSEC-2026-0098/0099/0104 (rustls-webpki
# 0.101). The list below is the SDK's default set minus `rustls`.
aws-sdk-s3 = { version = "1.85", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-config = { version = "1.8" }
# Short-lived S3 credentials (`s3.credentials = "web_identity"`): STS
# AssumeRoleWithWebIdentity against AWS or an S3-compatible STS endpoint.
# `default-features = false` for the same reason as `aws-sdk-s3` above (the
# SDK's `rustls` feature is the legacy connector); the call is unsigned, so
# no `sigv4a` either.
aws-sdk-sts = { version = "1.114", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-credential-types = { version = "1.2" }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form", "system-proxy"] }

# In-memory cache
moka = { version = "0.12", features = ["future"] }

# Glob matching for RBAC content selectors (slice 12.4): compile a GlobSet once
# per selector and match lowercased package names. Audited, standard choice.
globset = { version = "0.4" }

# Redis (optional)
# `tokio-rustls-comp`: `rediss://` URLs (TLS, verified against the system
# trust store).
redis = { version = "1", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }

# Futures combinators (Stream adapters for redis pub/sub)
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Error handling
anyhow = { version = "1" }
thiserror = { version = "2" }

# Tracing / logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Hashing
sha2 = { version = "0.11" }

# Keyed hashing (validated-credential cache key: HMAC-SHA256 with a server pepper)
hmac = { version = "0.13" }

# Hex encoding (token hashes)
hex = { version = "0.4" }

# Password hashing (PHC argon2 verification)
argon2 = { version = "0.6" }

# Constant-time comparison
subtle = { version = "2.6" }

# AEAD ciphers for secret encryption at rest (slice 12.5). AES-256-GCM is the
# default (hardware-accelerated, KMS-friendly); XChaCha20-Poly1305 is the
# opt-in alternative whose 192-bit extended nonce makes pure-random nonces
# collision-safe without any per-key counter state. `zeroize` scrubs the
# expanded key schedule (AES round keys, GHASH/ChaCha state) when a cipher
# instance is dropped; without it only our own key buffers were wiped.
aes-gcm = { version = "0.11", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }

# Scrub unwrapped key bytes / transient plaintext from memory on drop (12.5).
zeroize = { version = "1.8" }

# Secret wrappers that redact Debug/Display and zeroize on drop (12.5): the
# plaintext-secret type handed to callers so it can never leak into logs.
secrecy = { version = "0.10" }

# CSPRNG for token secrets
rand = { version = "0.10" }

# CIDR / IP network parsing (anon allowlist, SSRF guard)
ipnet = { version = "2.10" }

# URL parsing (SSRF guard)
url = { version = "2.5" }

# HTTP types (HeaderMap for principal sources)
http = { version = "1" }

# async fn in dyn traits (PrincipalSource, SSRF resolver)
async-trait = { version = "0.1" }

# Base64 (RFC 4648 standard alphabet)
base64 = { version = "0.23" }

# JWT decode/verify (OIDC ID-token signature + claim validation, slice 12.2).
# We use `jsonwebtoken` (not the heavier `openidconnect`) for Phase 2: it gives
# explicit control over the signing-key (RSA n/e from JWKS), the algorithm
# allowlist (reject `alg: none`/HMAC), and the iss/aud/exp leeway — and it slots
# cleanly behind the existing SSRF `guarded_client` + `forge-cache` rather than
# bringing its own HTTP-client abstraction.
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }

# Temp files
tempfile = { version = "3" }

# Date/time (shared with forge-db's model types)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# WebAssembly runtime for format plugins (forge-plugin). 48 is a Wasmtime LTS
# release (security fixes for two years) and the newest that builds with the
# pinned toolchain. Only what the host uses: the component model compiled by
# Cranelift, no WAT text parser, no GC proposals, no profiling or debugging.
wasmtime = { version = "48.0.7", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "std",
    "parallel-compilation",
] }
# WASI 0.2 for plugin components (a Rust guest's std imports it); the host
# grants no filesystem, network or environment.
wasmtime-wasi = { version = "48.0.7", default-features = false, features = ["p2"] }

# Format plugins built as WebAssembly components (`cargo xtask plugins`):
# small, self-contained `.wasm` files.
[profile.plugin]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Tests build unoptimized, yet the mock IdPs generate RSA keys and every test
# server hashes its bootstrap admin password: ~30x (RSA-2048 keygen, ~3 s) and
# ~15x (Argon2 default, ~0.3 s) slower than optimized. Optimize just those
# dependencies; the workspace crates stay fast to build and debug.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
