# GitLab CI for envisia-forge.
#
# Mirrors .github/workflows/ci.yml: fmt → clippy → test → e2e.
# Unit tests build/run with SQLX_OFFLINE=true against the committed .sqlx/ dir;
# the test/e2e jobs additionally provision a live Postgres 17 service, and e2e
# adds a versitygw S3 gateway. Dev credentials below are CI-only.

stages:
  - fmt
  - clippy
  - test
  - e2e

default:
  image: rust:latest

variables:
  CARGO_TERM_COLOR: "always"
  # Build against the committed .sqlx/ cache; no live DB needed for compilation.
  SQLX_OFFLINE: "true"
  # Keep cargo's registry/git caches inside the project dir so GitLab can cache them.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

# Shared cache for the cargo registry and build artefacts. Keyed per-branch so
# feature branches don't fight over a single cache entry.
.cargo-cache: &cargo-cache
  key:
    files:
      - Cargo.lock
    prefix: "$CI_JOB_NAME"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

# ── Formatting ─────────────────────────────────────────────────────────────
fmt:
  stage: fmt
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

# ── Clippy ─────────────────────────────────────────────────────────────────
clippy:
  stage: clippy
  needs: ["fmt"]
  cache:
    <<: *cargo-cache
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

# ── Unit tests (live Postgres service, SQLX_OFFLINE build) ───────────────────
# GitLab does not support per-service health-check options the way GitHub
# Actions does, so each job waits for its service containers to accept
# connections before running anything that touches them.
test:
  stage: test
  needs: ["fmt"]
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: forge
    POSTGRES_USER: forge
    POSTGRES_PASSWORD: forge
    DATABASE_URL: "postgres://forge:forge@postgres:5432/forge"
    FORGE_DATABASE_URL: "postgres://forge:forge@postgres:5432/forge"
  cache:
    <<: *cargo-cache
  before_script:
    # Wait for the postgres service to accept connections.
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - timeout 60 bash -c 'until pg_isready -h postgres -p 5432 -U forge; do sleep 1; done'
  script:
    - cargo build --workspace
    # forge-e2e feature is intentionally excluded here — unit tests only.
    - cargo test --workspace
    # sqlx cache drift guard (A1): apply migrations to the live DB, then verify
    # the committed .sqlx/ cache matches the current queries + schema.
    - cargo install sqlx-cli --version ^0.8 --no-default-features --features rustls,postgres --locked
    - SQLX_OFFLINE= sqlx migrate run --source migrations
    - SQLX_OFFLINE= cargo sqlx prepare --check --workspace -- --all-targets --all-features

# ── E2E / integration tests (Postgres + versitygw containers) ────────────────
# Gated behind the `forge-e2e` feature in the forge-e2e crate. Runs only on the
# default branch to keep MR pipelines fast.
e2e:
  stage: e2e
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: postgres:17
      alias: postgres
    # versitygw: posix backend over /data on port 7070. The posix backend
    # treats each subdir of /data as a bucket; the bucket dir is created by the
    # test harness (or pre-created against the running service).
    - name: versity/versitygw:v1.4.1
      alias: versitygw
      command:
        ["--port", ":7070", "--access", "minioadmin", "--secret", "minioadmin", "posix", "/data"]
  variables:
    POSTGRES_DB: forge
    POSTGRES_USER: forge
    POSTGRES_PASSWORD: forge
    DATABASE_URL: "postgres://forge:forge@postgres:5432/forge"
    FORGE_DATABASE_URL: "postgres://forge:forge@postgres:5432/forge"
    FORGE_S3_ENDPOINT: "http://versitygw:7070"
    FORGE_S3_REGION: "us-east-1"
    FORGE_S3_BUCKET: "forge"
    FORGE_S3_ACCESS_KEY: "minioadmin"
    FORGE_S3_SECRET_KEY: "minioadmin"
    FORGE_S3_FORCE_PATH_STYLE: "true"
  cache:
    <<: *cargo-cache
  before_script:
    # Wait for the postgres + versitygw services to accept connections.
    - apt-get update -qq && apt-get install -y -qq postgresql-client curl
    - timeout 60 bash -c 'until pg_isready -h postgres -p 5432 -U forge; do sleep 1; done'
    - timeout 60 bash -c 'until curl -sf http://versitygw:7070/ >/dev/null 2>&1 || curl -s http://versitygw:7070/ 2>&1 | grep -q "NoSuchBucket\|ListBuckets\|InvalidRequest\|AccessDenied"; do sleep 1; done'
  script:
    - cargo test --workspace --features forge-e2e
