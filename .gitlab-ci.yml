# GitLab CI for envisia-forge.
#
# Mirrors .github/workflows/ci.yml job for job (fmt, clippy, audit, test,
# docker, kubernetes, web; e2e and web-e2e in merge trains, GitLab's merge
# queue, and on the default branch), with the same tool versions and cargo
# settings; change both together. Images are pinned by digest (tag kept for
# readability), as ci.yml pins its actions; nothing bumps them here, so do it
# by hand. The images the test harnesses start themselves (postgres:17,
# versity/versitygw:v1.4.1 and v1.9.0, redis) are named by tag in their
# code, as on GitHub. Docker Hub images come through Google's mirror,
# mirror.gcr.io (the same images under the same digests, without Docker Hub's
# pull rate limit): by name here and in the harnesses, and the Dockerfile's
# through the Docker-in-Docker daemon's registry mirror.
#
# The GitHub runners come with a Docker daemon; here the jobs that need one
# (test, docker, e2e, web-e2e) get a Docker-in-Docker service, which needs a
# runner that allows privileged services. Dev credentials below are CI-only.

# One pipeline per change: merge-request pipelines for MRs, branch pipelines
# only when no MR is open for the branch (and always for the default branch
# and tags). Without this, a push to an MR branch starts both a branch and an
# MR pipeline running the same jobs. A newer commit cancels a still-running
# pipeline, except on the default branch, so every merge is fully verified.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages:
  - fmt
  - clippy
  - test
  - build
  - web
  - e2e

default:
  # Keep in lock-step with rust-toolchain.toml (same image as the Dockerfile's
  # builder stage).
  image: mirror.gcr.io/library/rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
  # A newer commit on the same MR/branch cancels a still-running pipeline.
  interruptible: true

variables:
  CARGO_TERM_COLOR: "always"
  # Small target/ (see .github/workflows/ci.yml).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  # Build against the committed .sqlx/ cache; no live DB needed for compilation.
  SQLX_OFFLINE: "true"
  # Keep cargo's registry/git caches inside the project dir so GitLab can cache
  # them. `cargo install` (and rustup) then put binaries in $CARGO_HOME/bin,
  # which is not on the image's PATH: a job that runs one adds it.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

# Cache for the cargo registry and build artefacts, one per job, keyed on
# Cargo.lock and the toolchain.
.cargo-cache: &cargo-cache
  key:
    files:
      - Cargo.lock
      - rust-toolchain.toml
    prefix: "$CI_JOB_NAME"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

# Docker-in-Docker, reached over TCP (no TLS inside the job's network). The
# testcontainers harnesses take the host of a container's published ports
# from DOCKER_HOST, so they connect to `docker` with no further settings.
# Docker Hub pulls by its own name (the Dockerfile's) go through mirror.gcr.io.
.dind-service: &dind-service
  name: mirror.gcr.io/library/docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  alias: docker
  command: ["--tls=false", "--registry-mirror=https://mirror.gcr.io"]

.dind-variables: &dind-variables
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

# ── Formatting, and the changelog fragments ────────────────────────────────
# As on GitHub, the fragment check builds only xtask.
fmt:
  stage: fmt
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check
    - cargo xtask changelog --check

# ── Clippy, and the sqlx offline-cache drift guard ─────────────────────────
# Both are check builds; as on GitHub, the drift guard runs here rather than
# in `test`, off the longest job's path. GitLab services have no health checks
# like GitHub's, so the job waits for Postgres before using it.
clippy:
  stage: clippy
  needs: ["fmt"]
  services:
    - name: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
      alias: postgres
  variables:
    POSTGRES_DB: forge
    POSTGRES_USER: forge
    POSTGRES_PASSWORD: forge
    DATABASE_URL: "postgres://forge:forge@postgres:5432/forge"
  cache:
    <<: *cargo-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - timeout 60 bash -c 'until pg_isready -h postgres -p 5432 -U forge; do sleep 1; done'
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings
    # sqlx cache drift guard (A1): apply migrations to the live DB, then verify
    # the committed .sqlx/ cache matches the current queries + schema.
    - cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
    - export PATH="$CARGO_HOME/bin:$PATH"
    - SQLX_OFFLINE= sqlx migrate run --source migrations
    - SQLX_OFFLINE= cargo sqlx prepare --check --workspace -- --all-targets --all-features

# ── Dependency advisories (RustSec) ────────────────────────────────────────
# Fails on any known vulnerability in Cargo.lock. Accepted advisories, each
# with a one-line rationale, live in .cargo/audit.toml. Reads only the
# lockfile (no build), so it needs no build cache.
audit:
  stage: test
  needs: []
  script:
    - cargo install cargo-audit --version 0.22.2 --locked
    - cargo audit

# ── Format plugins as WebAssembly components (plugins/<id>/) ──────────────
# The plugins are workspace crates (fmt, clippy and their tests run with the
# workspace); this checks that each one also lints clean and builds as a
# component for wasm32-wasip2. The tests that load a component run in `test`.
plugins:
  stage: test
  needs: ["fmt"]
  cache:
    <<: *cargo-cache
  script:
    - rustup component add clippy
    - rustup target add wasm32-wasip2
    - cargo xtask plugins-check

# ── Unit + integration tests ───────────────────────────────────────────────
# As on GitHub, the db/core/server/storage/cache integration tests start their
# own Postgres, versitygw and Redis with testcontainers, here on the dind
# service, so every test binary gets fresh containers (FORGE_TEST_* pointed at
# GitLab services would make all crates' suites share one database). The job
# waits for the dind daemon before using it. No separate `cargo build
# --workspace`: `cargo test` builds with the dev-dependencies' features, so it
# would rebuild most of it.
test:
  stage: test
  needs: ["fmt"]
  services:
    - *dind-service
  variables:
    <<: *dind-variables
    FORGE_TEST_TIMINGS: "$CI_PROJECT_DIR/.test-timings"
  cache:
    <<: *cargo-cache
  before_script:
    - timeout 60 bash -c 'until curl -fs http://docker:2375/_ping >/dev/null; do sleep 1; done'
  script:
    # The format-plugin tests build plugins/ as WebAssembly components.
    - rustup target add wasm32-wasip2
    # forge-e2e feature is intentionally excluded here — unit tests only.
    # Each test binary runs through test-timings-runner.sh, which adds every
    # test's duration to its result line and records it for after_script.
    - CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$CI_PROJECT_DIR/.github/scripts/test-timings-runner.sh" cargo test --workspace
  after_script:
    # The slowest test binaries and tests (GitHub puts them in the job summary).
    - .github/scripts/test-timings-summary.sh "$FORGE_TEST_TIMINGS" || true
    # Keep the test binaries out of the cache (archived after after_script):
    # every run relinks them, and they are most of target/ (~19 GB).
    - find target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.so' -delete || true

# ── Container image (build only; releases push from release.yml) ─────────
# Builds the production Dockerfile on every change so a broken image is
# caught before a release tag, not by it.
docker:
  stage: build
  needs: ["fmt"]
  image: mirror.gcr.io/library/docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  services:
    - *dind-service
  variables:
    <<: *dind-variables
  before_script:
    - timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
  script:
    - docker build --build-arg FORGE_GIT_SHA="$CI_COMMIT_SHA" .

# ── Kubernetes manifests (deploy/kubernetes) ──────────────────────────────
# Checks that every image reference (Dockerfile, deploy/, the workflows) is
# pinned by digest, builds every overlay, and the base with each component,
# and validates the output against the Kubernetes schemas. Both tools are
# pinned by checksum.
# Not mirrored yet: ci.yml's kubernetes job also lints and renders the Helm
# chart (.github/scripts/helm-check.sh, Helm built with `go install`), which
# needs a pinned Go image here.
kubernetes:
  stage: test
  needs: []
  variables:
    KUSTOMIZE_VERSION: "5.7.1"
    KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8
    KUBECONFORM_VERSION: "0.7.0"
    KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
  before_script:
    - tools=$(mktemp -d)
    - curl -sSfL -o "$tools/kustomize.tgz" "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
    - curl -sSfL -o "$tools/kubeconform.tgz" "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
    - printf '%s  %s\n' "$KUSTOMIZE_SHA256" "$tools/kustomize.tgz" "$KUBECONFORM_SHA256" "$tools/kubeconform.tgz" | sha256sum -c -
    - tar -xzf "$tools/kustomize.tgz" -C "$tools" kustomize
    - tar -xzf "$tools/kubeconform.tgz" -C "$tools" kubeconform
    - export PATH="$tools:$PATH"
  script:
    - .github/scripts/image-pin-check.sh
    - .github/scripts/kustomize-check.sh 1.33.0

# ── Frontend (TanStack Router SPA in web/) ───────────────────────────────────
# Typecheck + unit/component tests (Vitest + RTL) + production build. The build
# output (web/dist/) is what the Rust server serves via ServeDir; building here
# guards against TS/Vite breakage. Runs on the node image, independent of the
# Rust jobs (only `needs: []` so it starts immediately).
web:
  stage: web
  needs: []
  image: mirror.gcr.io/library/node:22-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
  variables:
    PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  cache:
    key:
      files:
        - web/pnpm-lock.yaml
      prefix: "web"
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.5.0 --activate
    - cd web
    - pnpm config set store-dir "$PNPM_HOME"
  script:
    - pnpm install --frozen-lockfile
    - pnpm run tsc
    - pnpm run test
    - pnpm run build
    # Known-vulnerability check of the shipped (non-dev) web dependencies;
    # the Rust side is covered by the `audit` job.
    - pnpm audit --prod
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 day

# ── E2E / integration tests (forge-e2e crate, testcontainers) ────────────────
# The forge-e2e harness boots its OWN Postgres + versitygw (+ Redis, and a
# versitygw with its IAM/STS service) containers via testcontainers on the
# dind service, so no other `services:` are needed. The STS reaches the test
# process's mock OIDC issuer at the job's address on the route to the dind
# service.
# Gated behind the `forge-e2e` feature; left out of MR pipelines to keep them
# fast, but runs in merge trains (so a change that breaks it never lands) and
# on the default branch. The optional dotnet smoke test is skipped here (no SDK
# on the rust image); add a dotnet SDK to the image to exercise it.
e2e:
  stage: e2e
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - *dind-service
  variables:
    <<: *dind-variables
    FORGE_TEST_TIMINGS: "$CI_PROJECT_DIR/.test-timings"
  cache:
    <<: *cargo-cache
  before_script:
    # Wait for the dind daemon to accept connections.
    - apt-get update -qq && apt-get install -y -qq docker.io
    - timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
    # Pre-pull the images the harness uses (faster, deterministic).
    - docker pull mirror.gcr.io/library/postgres:17
    - docker pull mirror.gcr.io/versity/versitygw:v1.4.1
    - docker pull mirror.gcr.io/versity/versitygw:v1.9.0
    - docker pull mirror.gcr.io/library/redis:5.0
  script:
    - rustup target add wasm32-wasip2
    # Per-test timings, as in the test job.
    - CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$CI_PROJECT_DIR/.github/scripts/test-timings-runner.sh" cargo test --workspace --features forge-e2e
  after_script:
    - .github/scripts/test-timings-summary.sh "$FORGE_TEST_TIMINGS" || true
    # Keep the test binaries out of the cache (archived after after_script):
    # every run relinks them, and they are most of target/ (~19 GB).
    - find target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.so' -delete || true

# ── Frontend e2e (Playwright drives the Rust server serving the built UI) ──────
# Boots Postgres + versitygw via docker compose on the dind daemon, builds the
# SPA + server, and runs the browser specs. The compose-published ports live on
# the `docker` (dind) host, so the harness is pointed there via
# FORGE_E2E_DOCKER_HOST. Like e2e, only in merge trains and on the default
# branch (slow). Uses the official Playwright image (Ubuntu with Node, the
# browsers and their system deps) at the version of @playwright/test in
# web/package.json; the Rust toolchain is installed on top via rustup.
web-e2e:
  stage: e2e
  needs: []
  image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - *dind-service
  variables:
    <<: *dind-variables
    FORGE_E2E_DOCKER_HOST: "docker"
    SQLX_OFFLINE: "true"
  cache:
    <<: *cargo-cache
  before_script:
    # Ubuntu packages the compose v2 plugin (`docker compose`) as docker-compose-v2.
    - apt-get update -qq && apt-get install -y -qq docker.io docker-compose-v2 curl build-essential
    - timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
    - docker pull mirror.gcr.io/library/postgres:17
    - docker pull mirror.gcr.io/versity/versitygw:v1.4.1
    # rustup installs into $CARGO_HOME (see `variables`), not ~/.cargo.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
    - export PATH="$CARGO_HOME/bin:$PATH"
    - corepack enable && corepack prepare pnpm@11.5.0 --activate
  script:
    - cd web
    - pnpm install --frozen-lockfile
    # As on GitHub; a no-op while the image matches @playwright/test.
    - pnpm exec playwright install --with-deps chromium
    - pnpm run e2e
  artifacts:
    when: always
    paths:
      - web/playwright-report/
    expire_in: 7 days
