# GitLab CI for envisia-forge.
#
# Mirrors .github/workflows/ci.yml: fmt → clippy → test → e2e.
# Unit tests build/run with SQLX_OFFLINE=true against the committed .sqlx/ dir;
# the test/e2e jobs additionally provision a live Postgres 17 service, and e2e
# adds a versitygw S3 gateway. Dev credentials below are CI-only.

# One pipeline per change: merge-request pipelines for MRs, branch pipelines
# only when no MR is open for the branch (and always for the default branch
# and tags). Without this, a push to an MR branch starts both a branch and an
# MR pipeline running the same jobs.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages:
  - fmt
  - clippy
  - test
  - web
  - e2e

default:
  # Keep in lock-step with rust-toolchain.toml.
  image: rust:1.95.0
  # A newer commit on the same MR/branch cancels a still-running pipeline.
  interruptible: true

variables:
  CARGO_TERM_COLOR: "always"
  # Build against the committed .sqlx/ cache; no live DB needed for compilation.
  SQLX_OFFLINE: "true"
  # Keep cargo's registry/git caches inside the project dir so GitLab can cache them.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

# Shared cache for the cargo registry and build artefacts. Keyed per-branch so
# feature branches don't fight over a single cache entry.
.cargo-cache: &cargo-cache
  key:
    files:
      - Cargo.lock
    prefix: "$CI_JOB_NAME"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

# ── Formatting ─────────────────────────────────────────────────────────────
fmt:
  stage: fmt
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

# ── Clippy ─────────────────────────────────────────────────────────────────
clippy:
  stage: clippy
  needs: ["fmt"]
  cache:
    <<: *cargo-cache
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

# ── Unit tests (live Postgres service, SQLX_OFFLINE build) ───────────────────
# GitLab does not support per-service health-check options the way GitHub
# Actions does, so each job waits for its service containers to accept
# connections before running anything that touches them.
test:
  stage: test
  needs: ["fmt"]
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: forge
    POSTGRES_USER: forge
    POSTGRES_PASSWORD: forge
    DATABASE_URL: "postgres://forge:forge@postgres:5432/forge"
    FORGE_DATABASE_URL: "postgres://forge:forge@postgres:5432/forge"
  cache:
    <<: *cargo-cache
  before_script:
    # Wait for the postgres service to accept connections.
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - timeout 60 bash -c 'until pg_isready -h postgres -p 5432 -U forge; do sleep 1; done'
  script:
    - cargo build --workspace
    # forge-e2e feature is intentionally excluded here — unit tests only.
    - cargo test --workspace
    # sqlx cache drift guard (A1): apply migrations to the live DB, then verify
    # the committed .sqlx/ cache matches the current queries + schema.
    - cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked
    - SQLX_OFFLINE= sqlx migrate run --source migrations
    - SQLX_OFFLINE= cargo sqlx prepare --check --workspace -- --all-targets --all-features

# ── Frontend (TanStack Start SPA in web/) ────────────────────────────────────
# Typecheck + unit/component tests (Vitest + RTL) + production build. The build
# output (web/dist/) is what the Rust server serves via ServeDir; building here
# guards against TS/Vite breakage. Runs on the node image, independent of the
# Rust jobs (only `needs: []` so it starts immediately).
web:
  stage: web
  needs: []
  image: node:22
  variables:
    PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  cache:
    key:
      files:
        - web/pnpm-lock.yaml
      prefix: "web"
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.5.0 --activate
    - cd web
    - pnpm config set store-dir "$PNPM_HOME"
  script:
    - pnpm install --frozen-lockfile
    - pnpm run tsc
    - pnpm run test
    - pnpm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 day

# ── E2E / integration tests (forge-e2e crate, testcontainers) ────────────────
# The forge-e2e harness boots its OWN Postgres + versitygw (+ Redis) containers
# via testcontainers, so this job needs a Docker daemon rather than GitLab
# `services:`. We run Docker-in-Docker and point testcontainers at it.
# Gated behind the `forge-e2e` feature; runs only on the default branch to keep
# MR pipelines fast. The optional dotnet smoke test is skipped here (no SDK on
# the rust image); add a dotnet SDK to the image to exercise it.
e2e:
  stage: e2e
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    # Talk to the dind daemon over TCP (no TLS inside the CI network).
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    # testcontainers connects to the same daemon.
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    <<: *cargo-cache
  before_script:
    # Wait for the dind daemon to accept connections.
    - apt-get update -qq && apt-get install -y -qq docker.io
    - timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
    # Pre-pull the images the harness uses (faster, deterministic).
    - docker pull postgres:17
    - docker pull versity/versitygw:v1.4.1
    - docker pull redis:5.0
  script:
    - cargo test --workspace --features forge-e2e

# ── Frontend e2e (Playwright drives the Rust server serving the built UI) ──────
# Boots Postgres + versitygw via docker compose on the dind daemon, builds the
# SPA + server, and runs the browser specs. The compose-published ports live on
# the `docker` (dind) host, so the harness is pointed there via
# FORGE_E2E_DOCKER_HOST. Default-branch only (slow). Uses the official
# Playwright image which bundles browsers + a Node + system deps; the Rust
# toolchain is installed on top via rustup.
web-e2e:
  stage: e2e
  needs: ["web"]
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    FORGE_E2E_DOCKER_HOST: "docker"
    SQLX_OFFLINE: "true"
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io docker-compose-plugin curl build-essential
    - timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
    - docker pull postgres:17
    - docker pull versity/versitygw:v1.4.1
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
    - . "$HOME/.cargo/env"
    - corepack enable && corepack prepare pnpm@11.5.0 --activate
  script:
    - cd web && pnpm install --frozen-lockfile && cd ..
    - . "$HOME/.cargo/env" && cd web && pnpm run e2e
  artifacts:
    when: always
    paths:
      - web/playwright-report/
    expire_in: 7 days
