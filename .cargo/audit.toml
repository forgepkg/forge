# cargo-audit configuration, read by the `audit` CI job (.github/workflows/ci.yml)
# and by a local `cargo audit`. Every accepted advisory needs a one-line
# rationale; remove the entry as soon as an update makes it unnecessary.
[advisories]
ignore = [
    # rsa 0.9 Marvin timing side channel (no fixed release): a dev-dependency
    # only (forge-core, forge-server and forge-e2e tests sign test JWTs with
    # it); not in the shipped forge-server binary.
    "RUSTSEC-2023-0071",
]
